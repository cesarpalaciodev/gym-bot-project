name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio mypy ruff bandit safety

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy bot.py config.py core/ dashboard/ database/ handlers/ keyboards.py models/ providers/ repositories/ services/ utils/

      - name: Test with pytest
        run: pytest --cov=. --cov-report=term-missing -v --ignore=tests/test_integration_mongodb.py
        env:
          MONGO_URI: mongodb://localhost:27017/gym_test
          TOKEN: test_token
          ADMIN_ID: "12345"
          GROUP_ID: "-12345"
