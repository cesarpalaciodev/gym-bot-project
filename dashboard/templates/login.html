{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="bg-white dark:bg-dark-300 rounded-2xl border border-slate-200/70 dark:border-white/5 shadow-lg shadow-slate-200/30 dark:shadow-black/20 p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-brand-500/10 flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 7h11"/><path d="M6.5 17h11"/><path d="M6 20V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14"/><path d="M10 4v16"/><path d="M14 4v16"/>
                </svg>
            </div>
            <h1 class="font-heading text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">IronVault Gym</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-1.5 text-sm">Enter your Telegram Chat ID to sign in</p>
        </div>

        {% if error %}
        <div class="flex items-center gap-2 bg-red-500/10 border border-red-500/30 rounded-xl px-4 py-3 mb-6 text-red-600 dark:text-red-400 text-sm font-medium">
            <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5" for="chat_id">
                    Chat ID
                </label>
                <input
                    type="text"
                    name="chat_id"
                    id="chat_id"
                    required
                    placeholder="e.g. 123456789"
                    class="w-full px-4 py-3 bg-slate-50 dark:bg-dark-200 border border-slate-200 dark:border-white/10 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all duration-200 font-medium"
                >
            </div>
            <button
                type="submit"
                class="w-full py-3 bg-brand-500 hover:bg-brand-600 active:bg-brand-700 text-white font-bold rounded-xl transition-all duration-200 shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 cursor-pointer"
            >
                Sign In
            </button>
        </form>

        <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-6">
            Get your Chat ID from <a href="https://t.me/userinfobot" class="text-brand-500 hover:text-brand-600 font-medium" target="_blank">@userinfobot</a> on Telegram
        </p>
    </div>
</div>
{% endblock %}
