{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center relative">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-5 dark:opacity-20 animate-float pointer-events-none">
        <svg class="w-80 h-80" viewBox="0 0 200 200" fill="none">
            <rect x="40" y="30" width="45" height="14" rx="7" fill="#EF4444" opacity="0.15"/>
            <rect x="115" y="30" width="45" height="14" rx="7" fill="#EF4444" opacity="0.15"/>
            <path d="M60 44 L60 110 M140 44 L140 110" stroke="#EF4444" stroke-width="14" stroke-linecap="round" opacity="0.1"/>
            <circle cx="100" cy="145" r="4" fill="#EF4444" opacity="0.2"/>
        </svg>
    </div>

    <div class="relative w-full max-w-sm">
        <div class="mb-10">
            <div class="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center mb-6 shadow-lg shadow-brand-500/20">
                <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7h11"/><path d="M6.5 17h11"/><path d="M6 20V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14"/><path d="M10 4v16"/><path d="M14 4v16"/></svg>
            </div>
            <h1 class="font-heading text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Gym<span class="text-brand-600 dark:text-brand-400">Bot</span></h1>
            <p class="text-slate-500 text-sm mt-2">Sign in with your Telegram Chat ID</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 border border-red-200 dark:border-red-500/20 rounded-xl bg-red-50 dark:bg-red-500/5 text-red-600 dark:text-red-400 text-sm">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-5">
            <input type="text" name="chat_id" id="chat_id" required placeholder="Chat ID"
                class="w-full px-4 py-3.5 bg-slate-50 dark:bg-surface.100 border border-slate-200 dark:border-white/[0.08] rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500/20 transition-all duration-300">
            <button type="submit"
                class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-heading font-bold text-sm rounded-xl transition-all duration-300 shadow-lg shadow-brand-500/20 hover:shadow-brand-500/40 cursor-pointer">
                Enter Dashboard
            </button>
        </form>

        <p class="text-center text-[11px] text-slate-400 dark:text-slate-600 mt-8">
            Get your Chat ID from <a href="https://t.me/userinfobot" class="text-brand-600 dark:text-brand-400 hover:text-brand-500" target="_blank">@userinfobot</a>
        </p>
    </div>
</div>
{% endblock %}
