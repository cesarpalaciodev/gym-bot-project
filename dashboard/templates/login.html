{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="text-center mb-12">
            <div class="w-12 h-12 bg-gold-400 rounded-lg flex items-center justify-center mx-auto mb-6 shadow-xl shadow-gold-400/20">
                <svg class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6.5 7h11"/><path d="M6.5 17h11"/><path d="M6 20V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14"/><path d="M10 4v16"/><path d="M14 4v16"/>
                </svg>
            </div>
            <h1 class="font-serif text-3xl italic font-semibold text-stone-900 dark:text-white">IronVault</h1>
            <p class="text-stone-400 dark:text-stone-500 text-sm mt-3 font-light">Enter your Telegram Chat ID</p>
        </div>

        {% if error %}
        <div class="mb-8 p-4 border border-red-200 dark:border-red-500/20 text-red-500 text-sm font-light text-center">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-6">
            <input
                type="text"
                name="chat_id"
                id="chat_id"
                required
                placeholder="Chat ID"
                class="w-full px-0 py-3 bg-transparent border-b-2 border-stone-200 dark:border-white/10 text-stone-900 dark:text-white text-lg placeholder-stone-300 dark:placeholder-stone-600 focus:outline-none focus:border-gold-400 transition-colors duration-300 font-light"
            >
            <button
                type="submit"
                class="w-full py-4 bg-stone-900 dark:bg-white text-white dark:text-stone-900 font-serif text-lg italic hover:bg-gold-400 dark:hover:bg-gold-400 hover:text-white transition-all duration-300 cursor-pointer"
            >
                Enter
            </button>
        </form>

        <p class="text-center text-xs text-stone-300 dark:text-stone-600 mt-12 font-light">
            Get your ID from <a href="https://t.me/userinfobot" class="text-gold-400 hover:text-gold-500" target="_blank">@userinfobot</a>
        </p>
    </div>
</div>
{% endblock %}
