{% extends "base.html" %}

{% block title %}Stats{% endblock %}

{% block head %}
<script>
document.addEventListener('DOMContentLoaded', async () => {
    try {
        const resp = await fetch('/api/stats');
        const data = await resp.json();
        document.getElementById('active-members').textContent = data.active_members;
        document.getElementById('in-grace').textContent = data.in_grace;
        document.getElementById('overdue').textContent = data.overdue;
        document.getElementById('monthly-income').textContent = '$' + Number(data.monthly_income).toLocaleString();
        document.getElementById('prev-income').textContent = '$' + Number(data.previous_month_income).toLocaleString();
        const pct = data.income_change_pct;
        const el = document.getElementById('income-change');
        el.textContent = (pct >= 0 ? '+' : '') + pct + '%';
        el.className = pct >= 0 ? 'text-stone-700 dark:text-stone-300' : 'text-red-400';
    } catch (e) { document.getElementById('error-msg').classList.remove('hidden'); }
});
</script>
{% endblock %}

{% block content %}
<div class="mb-16">
    <h1 class="font-serif text-5xl md:text-6xl font-semibold italic text-stone-900 dark:text-white leading-none">
        Performance <span class="text-gold-400">metrics</span>
    </h1>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-1 mb-16">
    <div class="bg-white dark:bg-[#141211] border border-stone-200 dark:border-white/5 p-10">
        <p class="text-[11px] font-medium tracking-[0.2em] uppercase text-stone-400 mb-6">Active</p>
        <p class="font-serif text-7xl font-light italic text-stone-900 dark:text-white" id="active-members">--</p>
    </div>
    <div class="bg-white dark:bg-[#141211] border border-stone-200 dark:border-white/5 p-10">
        <p class="text-[11px] font-medium tracking-[0.2em] uppercase text-stone-400 mb-6">In Grace</p>
        <p class="font-serif text-7xl font-light italic text-gold-400" id="in-grace">--</p>
    </div>
    <div class="bg-white dark:bg-[#141211] border border-stone-200 dark:border-white/5 p-10">
        <p class="text-[11px] font-medium tracking-[0.2em] uppercase text-stone-400 mb-6">Overdue</p>
        <p class="font-serif text-7xl font-light italic text-red-400" id="overdue">--</p>
    </div>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-1">
    <div class="bg-white dark:bg-[#141211] border border-stone-200 dark:border-white/5 p-10">
        <p class="text-[11px] font-medium tracking-[0.2em] uppercase text-stone-400 mb-6">Monthly Income</p>
        <p class="font-serif text-6xl font-light italic text-stone-900 dark:text-white" id="monthly-income">--</p>
    </div>
    <div class="bg-white dark:bg-[#141211] border border-stone-200 dark:border-white/5 p-10">
        <p class="text-[11px] font-medium tracking-[0.2em] uppercase text-stone-400 mb-6">Previous Month</p>
        <p class="font-serif text-5xl font-light italic text-stone-300 dark:text-stone-600" id="prev-income">--</p>
        <p class="mt-4 text-sm font-light"><span class="text-stone-400">vs:</span> <span id="income-change" class="font-medium">--</span></p>
    </div>
</div>

<div id="error-msg" class="hidden mt-12 p-6 border border-red-200 dark:border-red-500/20 text-red-500 text-sm font-light text-center">Error loading data</div>
{% endblock %}
