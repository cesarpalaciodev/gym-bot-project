{% extends "base.html" %}

{% block title %}Health{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-gray-900/60 rounded-2xl border border-gray-800 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-800">
            <h2 class="text-lg font-semibold">System Health</h2>
        </div>
        <div class="p-6 space-y-4">
            <div class="flex items-center justify-between p-4 bg-gray-800/40 rounded-xl">
                <span class="text-gray-300">API Status</span>
                <span class="px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400">Online</span>
            </div>
            <div class="flex items-center justify-between p-4 bg-gray-800/40 rounded-xl">
                <span class="text-gray-300">Database</span>
                {% if db_status == "connected" %}
                <span class="px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400">Connected</span>
                {% else %}
                <span class="px-3 py-1 rounded-full text-xs font-medium bg-red-500/10 text-red-400">Disconnected</span>
                {% endif %}
            </div>
            <div class="flex items-center justify-between p-4 bg-gray-800/40 rounded-xl">
                <span class="text-gray-300">Server Port</span>
                <span class="text-sm text-gray-400 font-mono">4000</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
