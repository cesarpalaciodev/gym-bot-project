{% extends "base.html" %}

{% block title %}Health{% endblock %}

{% block content %}
<div class="mb-16">
    <h1 class="font-serif text-5xl md:text-6xl font-semibold italic text-stone-900 dark:text-white leading-none">
        System <span class="text-gold-400">health</span>
    </h1>
</div>

<div class="max-w-md mx-auto space-y-1">
    <div class="bg-white dark:bg-[#141211] border border-stone-200 dark:border-white/5 p-8 flex items-center justify-between">
        <p class="text-sm font-medium text-stone-700 dark:text-stone-300">API</p>
        <span class="text-xs font-medium tracking-wide uppercase text-stone-400">Online</span>
    </div>
    <div class="bg-white dark:bg-[#141211] border border-stone-200 dark:border-white/5 p-8 flex items-center justify-between">
        <p class="text-sm font-medium text-stone-700 dark:text-stone-300">Database</p>
        {% if db_status == "connected" %}
        <span class="text-xs font-medium tracking-wide uppercase text-stone-400">Connected</span>
        {% else %}
        <span class="text-xs font-medium tracking-wide uppercase text-red-400">Disconnected</span>
        {% endif %}
    </div>
    <div class="bg-white dark:bg-[#141211] border border-stone-200 dark:border-white/5 p-8 flex items-center justify-between">
        <p class="text-sm font-medium text-stone-700 dark:text-stone-300">Port</p>
        <span class="text-xs font-mono font-light text-stone-400">{{ port or '3000' }}</span>
    </div>
</div>
{% endblock %}
