{% extends "base.html" %}

{% block title %}Health{% endblock %}

{% block content %}
<div class="mb-16">
    <p class="text-brand-600 dark:text-brand-400 text-xs font-heading font-semibold tracking-[0.2em] uppercase mb-4">System</p>
    <h1 class="heading font-heading text-[2.75rem] sm:text-6xl font-bold text-slate-900 leading-[1.05] tracking-tight">
        Health <span class="text-brand-600 dark:text-brand-400">check</span>
    </h1>
</div>

<div class="max-w-md mx-auto space-y-3">
    <div class="card bg-white border border-slate-200 rounded-2xl px-8 py-7 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-4">
            <span class="w-1.5 h-1.5 rounded-full bg-brand-500 animate-glow"></span>
            <span class="text-sm font-medium text-slate-700 dark:text-slate-300">API Status</span>
        </div>
        <span class="text-[11px] font-heading font-semibold tracking-wider uppercase text-brand-600 dark:text-brand-400">Online</span>
    </div>
    <div class="card bg-white border border-slate-200 rounded-2xl px-8 py-7 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-4">
            <span class="w-1.5 h-1.5 rounded-full {% if db_status == 'connected' %}bg-brand-500 animate-glow{% else %}bg-red-500{% endif %}"></span>
            <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Database</span>
        </div>
        {% if db_status == "connected" %}
        <span class="text-[11px] font-heading font-semibold tracking-wider uppercase text-brand-600 dark:text-brand-400">Connected</span>
        {% else %}
        <span class="text-[11px] font-heading font-semibold tracking-wider uppercase text-red-500 dark:text-red-400">Disconnected</span>
        {% endif %}
    </div>
    <div class="card bg-white border border-slate-200 rounded-2xl px-8 py-7 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-4">
            <span class="w-1.5 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600"></span>
            <span class="text-sm font-medium text-slate-700 dark:text-slate-300">Port</span>
        </div>
        <span class="text-xs font-mono text-slate-400 dark:text-slate-500">{{ port or '3000' }}</span>
    </div>
</div>
{% endblock %}
