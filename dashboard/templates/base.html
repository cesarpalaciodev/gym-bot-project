<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} | GymBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
                        body: ['"DM Sans"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#FEF2F2', 100: '#FEE2E2', 200: '#FECACA', 300: '#FCA5A5',
                            400: '#F87171', 500: '#EF4444', 600: '#DC2626', 700: '#B91C1C',
                        },
                        surface: {
                            DEFAULT: '#06080D', 100: '#0A0D14', 200: '#0F121A',
                            300: '#141822', 400: '#1A1F2E',
                        },
                    },
                },
            },
        }
    </script>
    <style>
        .bg-grid { background-image: radial-gradient(circle, rgba(239,68,68,0.06) 1px, transparent 1px); background-size: 32px 32px; }
        .bg-glow { background: radial-gradient(ellipse 80% 60% at 50% -20%, rgba(239,68,68,0.08), transparent 70%); }
        .bg-glow2 { background: radial-gradient(ellipse 60% 50% at 80% 80%, rgba(239,68,68,0.05), transparent 70%); }
        .line-clamp { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; }
        @keyframes float { 0%,100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
        @keyframes pulse-glow { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-glow { animation: pulse-glow 4s ease-in-out infinite; }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.05s; } .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; } .delay-4 { animation-delay: 0.2s; }
        .delay-5 { animation-delay: 0.25s; } .delay-6 { animation-delay: 0.3s; }

        /* Dark mode overrides (CDN-friendly: use CSS not Tailwind dark: prefix for custom colors) */
        .dark body { background-color: #06080D; color: #CBD5E1; }
        .dark .card { background-color: #0A0D14; border-color: rgba(255,255,255,0.06); }
        .dark .card-hover:hover { background-color: #0F121A; border-color: rgba(239,68,68,0.2); }
        .dark .nav-bg { background-color: rgba(15,18,26,0.7); border-color: rgba(255,255,255,0.05); }
        .dark .heading { color: #FFFFFF; }
        .dark .subtext { color: #94A3B8; }
        .dark .link { color: #64748B; }
        .dark .link:hover { color: #FFFFFF; }
        .dark .table-row { border-color: rgba(255,255,255,0.04); }
        .dark .table-row:hover { background-color: rgba(255,255,255,0.02); }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="font-body bg-white text-slate-700 min-h-screen antialiased transition-colors duration-500 relative overflow-x-hidden">
    <div class="fixed inset-0 bg-grid pointer-events-none z-0 hidden dark:block"></div>
    <div class="fixed inset-0 bg-glow pointer-events-none z-0 hidden dark:block"></div>
    <div class="fixed inset-0 bg-glow2 pointer-events-none z-0 hidden dark:block"></div>

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50">
        <div class="mx-3 mt-3 max-w-6xl xl:mx-auto">
            <div class="nav-bg bg-white/80 backdrop-blur-2xl border border-slate-200 rounded-2xl px-6 shadow-sm">
                <div class="flex items-center justify-between h-14">
                    <a href="/" class="flex items-center gap-2.5 group">
                        <span class="text-2xl select-none group-hover:scale-110 transition-transform duration-300">&#x1F4AA;</span>
                        <span class="font-heading text-lg font-bold tracking-tight text-slate-900 dark:text-white">Gym<span class="text-brand-500 dark:text-brand-400">Bot</span></span>
                    </a>

                    <div class="hidden lg:flex items-center gap-1">
                        <a href="/" class="nav-link px-3.5 py-2 rounded-lg text-[13px] font-heading font-medium tracking-wide text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white hover:bg-brand-50 dark:hover:bg-white/5 transition-all duration-300">Dashboard</a>
                        <a href="/dashboard/stats" class="nav-link px-3.5 py-2 rounded-lg text-[13px] font-heading font-medium tracking-wide text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white hover:bg-brand-50 dark:hover:bg-white/5 transition-all duration-300">Stats</a>
                        <a href="/dashboard/members" class="nav-link px-3.5 py-2 rounded-lg text-[13px] font-heading font-medium tracking-wide text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white hover:bg-brand-50 dark:hover:bg-white/5 transition-all duration-300">Members</a>
                        <a href="/dashboard/payments" class="nav-link px-3.5 py-2 rounded-lg text-[13px] font-heading font-medium tracking-wide text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white hover:bg-brand-50 dark:hover:bg-white/5 transition-all duration-300">Payments</a>
                        <a href="/dashboard/health" class="nav-link px-3.5 py-2 rounded-lg text-[13px] font-heading font-medium tracking-wide text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white hover:bg-brand-50 dark:hover:bg-white/5 transition-all duration-300">Health</a>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="theme-toggle" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5 transition-all duration-300 cursor-pointer" aria-label="Toggle theme">
                            <svg id="theme-sun" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
                            <svg id="theme-moon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        </button>
                        <button id="mobile-menu-btn" class="lg:hidden w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-white cursor-pointer" aria-label="Menu">
                            <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
                        </button>
                        {% if admin %}
                        <a href="/logout" class="hidden sm:flex text-[11px] font-heading font-semibold tracking-widest uppercase text-slate-400 dark:text-slate-500 hover:text-red-500 dark:hover:text-red-400 transition-colors duration-300 ml-2 cursor-pointer">Exit</a>
                        {% endif %}
                    </div>
                </div>
                <div id="mobile-menu" class="hidden lg:hidden border-t border-slate-200 dark:border-white/5 py-4 space-y-1">
                    <a href="/" class="block px-3 py-2.5 text-sm text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white font-heading">Dashboard</a>
                    <a href="/dashboard/stats" class="block px-3 py-2.5 text-sm text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white font-heading">Stats</a>
                    <a href="/dashboard/members" class="block px-3 py-2.5 text-sm text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white font-heading">Members</a>
                    <a href="/dashboard/payments" class="block px-3 py-2.5 text-sm text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white font-heading">Payments</a>
                    <a href="/dashboard/health" class="block px-3 py-2.5 text-sm text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-white font-heading">Health</a>
                    {% if admin %}
                    <a href="/logout" class="block px-3 py-2.5 text-sm text-red-500 dark:text-red-400 hover:text-red-600 dark:hover:text-red-300 font-heading">Exit</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="relative z-10 max-w-6xl mx-auto px-6 lg:px-8 pt-28 pb-24">
        {% block content %}{% endblock %}
    </main>

    <script>
        (function() {
            const html = document.documentElement, toggle = document.getElementById('theme-toggle');
            const sun = document.getElementById('theme-sun'), moon = document.getElementById('theme-moon');
            function set(d) {
                if (d) { html.classList.add('dark'); sun.classList.remove('hidden'); moon.classList.add('hidden'); localStorage.setItem('theme','dark'); }
                else { html.classList.remove('dark'); sun.classList.add('hidden'); moon.classList.remove('hidden'); localStorage.setItem('theme','light'); }
            }
            const s = localStorage.getItem('theme');
            set(s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
            toggle.addEventListener('click', () => set(!html.classList.contains('dark')));
            const path = window.location.pathname;
            document.querySelectorAll('nav a[href]').forEach(l => {
                const h = l.getAttribute('href');
                if (h !== '/' && path.startsWith(h)) { l.classList.add('text-brand-600','dark:text-brand-400'); }
                if (h === '/' && path === '/') { l.classList.add('text-brand-600','dark:text-brand-400'); }
            });
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                document.getElementById('mobile-menu').classList.toggle('hidden');
            });
        })();
    </script>
</body>
</html>
