<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} | IronVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Bodoni Moda"', 'Georgia', 'serif'],
                        sans: ['"Jost"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        gold: { 400: '#CA8A04', 500: '#B07D02', 600: '#966D01' },
                    },
                },
            },
        }
    </script>
    {% block head %}{% endblock %}
</head>
<body class="font-sans bg-stone-50 dark:bg-[#0D0B0A] text-stone-900 dark:text-stone-200 min-h-screen antialiased transition-colors duration-500">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 border-b border-stone-200/60 dark:border-white/5 bg-stone-50/90 dark:bg-[#0D0B0A]/90 backdrop-blur-xl">
        <div class="max-w-6xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/" class="flex items-center gap-3 group">
                    <div class="w-9 h-9 bg-gold-400 rounded-lg flex items-center justify-center shadow-lg shadow-gold-400/20">
                        <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6.5 7h11"/><path d="M6.5 17h11"/><path d="M6 20V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14"/><path d="M10 4v16"/><path d="M14 4v16"/>
                        </svg>
                    </div>
                    <div>
                        <span class="font-serif text-xl font-semibold italic tracking-tight text-stone-900 dark:text-white">IronVault</span>
                        <span class="block text-[10px] uppercase tracking-[0.2em] text-stone-400 dark:text-stone-500 -mt-0.5">Gym</span>
                    </div>
                </a>

                <div class="hidden md:flex items-center gap-8">
                    <a href="/" class="nav-link text-sm font-medium tracking-wide uppercase">Dashboard</a>
                    <a href="/dashboard/stats" class="nav-link text-sm font-medium tracking-wide uppercase">Stats</a>
                    <a href="/dashboard/members" class="nav-link text-sm font-medium tracking-wide uppercase">Members</a>
                    <a href="/dashboard/payments" class="nav-link text-sm font-medium tracking-wide uppercase">Payments</a>
                    <a href="/dashboard/health" class="nav-link text-sm font-medium tracking-wide uppercase">Health</a>
                </div>

                <div class="flex items-center gap-4">
                    <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-full text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 hover:bg-stone-100 dark:hover:bg-white/5 transition-all duration-300 cursor-pointer" aria-label="Toggle theme">
                        <svg id="theme-sun" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
                        <svg id="theme-moon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                    <button id="mobile-menu-btn" class="md:hidden w-9 h-9 flex items-center justify-center rounded-full text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 cursor-pointer" aria-label="Menu">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
                    </button>
                    {% if admin %}
                    <a href="/logout" class="text-xs font-medium tracking-wide uppercase text-stone-400 hover:text-red-500 transition-colors duration-300 cursor-pointer">Exit</a>
                    {% endif %}
                </div>
            </div>
            <div id="mobile-menu" class="hidden md:hidden border-t border-stone-200/60 dark:border-white/5 py-4 space-y-1">
                <a href="/" class="block px-3 py-2 text-sm font-medium tracking-wide uppercase text-stone-600 dark:text-stone-400 hover:text-gold-400">Dashboard</a>
                <a href="/dashboard/stats" class="block px-3 py-2 text-sm font-medium tracking-wide uppercase text-stone-600 dark:text-stone-400 hover:text-gold-400">Stats</a>
                <a href="/dashboard/members" class="block px-3 py-2 text-sm font-medium tracking-wide uppercase text-stone-600 dark:text-stone-400 hover:text-gold-400">Members</a>
                <a href="/dashboard/payments" class="block px-3 py-2 text-sm font-medium tracking-wide uppercase text-stone-600 dark:text-stone-400 hover:text-gold-400">Payments</a>
                <a href="/dashboard/health" class="block px-3 py-2 text-sm font-medium tracking-wide uppercase text-stone-600 dark:text-stone-400 hover:text-gold-400">Health</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 lg:px-8 pt-24 pb-20">
        {% block content %}{% endblock %}
    </main>

    <style>
        .nav-link { color: #78716C; transition: color 0.3s; }
        .nav-link:hover { color: #CA8A04; }
        .dark .nav-link { color: #78716C; }
        .dark .nav-link:hover { color: #CA8A04; }
    </style>

    <script>
        (function() {
            const html = document.documentElement;
            const toggle = document.getElementById('theme-toggle');
            const sun = document.getElementById('theme-sun');
            const moon = document.getElementById('theme-moon');
            function set(d) {
                if (d) { html.classList.add('dark'); sun.classList.remove('hidden'); moon.classList.add('hidden'); localStorage.setItem('theme','dark'); }
                else { html.classList.remove('dark'); sun.classList.add('hidden'); moon.classList.remove('hidden'); localStorage.setItem('theme','light'); }
            }
            const s = localStorage.getItem('theme');
            set(s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
            toggle.addEventListener('click', () => set(!html.classList.contains('dark')));
            const p = window.location.pathname;
            document.querySelectorAll('nav a[href]').forEach(l => {
                const h = l.getAttribute('href');
                if (h === p || (h !== '/' && p.startsWith(h))) l.style.color = '#CA8A04';
            });
            document.getElementById('mobile-menu-btn').addEventListener('click', () => document.getElementById('mobile-menu').classList.toggle('hidden'));
        })();
    </script>
</body>
</html>
