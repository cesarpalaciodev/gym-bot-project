<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} | IronVault Gym</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"Barlow Condensed"', 'sans-serif'],
                        body: ['"Barlow"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#FFF7ED', 100: '#FFEDD5', 200: '#FED7AA', 300: '#FDBA74',
                            400: '#FB923C', 500: '#F97316', 600: '#EA580C', 700: '#C2410C',
                            800: '#9A3412', 900: '#7C2D12', 950: '#431407',
                        },
                        surface: {
                            light: '#F8FAFC',
                            DEFAULT: '#F1F5F9',
                            dark: '#E2E8F0',
                        },
                        dark: {
                            50: '#334155', 100: '#1E293B', 200: '#1A1F2E', 300: '#151A27',
                            400: '#111620', 500: '#0D1117', 600: '#0A0D14',
                        },
                    },
                },
            },
        }
    </script>
    {% block head %}{% endblock %}
</head>
<body class="font-body bg-surface-light dark:bg-dark-500 text-slate-800 dark:text-slate-100 min-h-screen antialiased transition-colors duration-300">

    <!-- Navbar -->
    <nav class="fixed top-3 left-3 right-3 z-50">
        <div class="max-w-7xl mx-auto bg-white/80 dark:bg-dark-300/80 backdrop-blur-xl rounded-2xl border border-slate-200/60 dark:border-white/5 shadow-lg shadow-slate-200/30 dark:shadow-black/20">
            <div class="flex items-center justify-between h-14 px-4 sm:px-6">
                <!-- Logo -->
                <a href="/" class="flex items-center gap-2.5 group">
                    <svg class="w-7 h-7 text-brand-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6.5 7h11"/>
                        <path d="M6.5 17h11"/>
                        <path d="M6 20V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14"/>
                        <path d="M10 4v16"/>
                        <path d="M14 4v16"/>
                    </svg>
                    <span class="font-heading font-bold text-lg tracking-tight text-slate-900 dark:text-white">IronVault</span>
                </a>

                <!-- Nav Links -->
                <div class="hidden md:flex items-center gap-1">
                    <a href="/" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors duration-200">
                        Dashboard
                    </a>
                    <a href="/dashboard/stats" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors duration-200">
                        Stats
                    </a>
                    <a href="/dashboard/members" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors duration-200">
                        Members
                    </a>
                    <a href="/dashboard/payments" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors duration-200">
                        Payments
                    </a>
                    <a href="/dashboard/health" class="px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 transition-colors duration-200">
                        Health
                    </a>
                </div>

                <!-- Right Section -->
                <div class="flex items-center gap-3">
                    <!-- Theme Toggle -->
                    <button id="theme-toggle" class="relative w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:text-brand-500 dark:hover:text-brand-400 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors duration-200 cursor-pointer" aria-label="Toggle theme">
                        <svg id="theme-sun" class="w-4.5 h-4.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/>
                        </svg>
                        <svg id="theme-moon" class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                        </svg>
                    </button>

                    <!-- Mobile Menu Button -->
                    <button id="mobile-menu-btn" class="md:hidden w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-400 hover:text-brand-500 dark:hover:text-brand-400 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors duration-200 cursor-pointer" aria-label="Menu">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
                        </svg>
                    </button>

                    {% if admin %}
                    <span class="hidden sm:inline text-xs text-slate-400 dark:text-slate-500 ml-2">ID: {{ admin.chat_id }}</span>
                    <a href="/logout" class="text-xs px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-white/5 text-slate-500 dark:text-slate-400 hover:text-red-500 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors duration-200 font-medium cursor-pointer">
                        Salir
                    </a>
                    {% endif %}
                </div>
            </div>

            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200/60 dark:border-white/5 px-4 py-3 space-y-1">
                <a href="/" class="block px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200 text-slate-700 dark:text-slate-300 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10">Dashboard</a>
                <a href="/dashboard/stats" class="block px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200 text-slate-700 dark:text-slate-300 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10">Stats</a>
                <a href="/dashboard/members" class="block px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200 text-slate-700 dark:text-slate-300 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10">Members</a>
                <a href="/dashboard/payments" class="block px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200 text-slate-700 dark:text-slate-300 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10">Payments</a>
                <a href="/dashboard/health" class="block px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200 text-slate-700 dark:text-slate-300 hover:text-brand-500 hover:bg-brand-50 dark:hover:bg-brand-500/10">Health</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-12">
        {% block content %}{% endblock %}
    </main>

    <!-- Theme Toggle + Active Nav Script -->
    <script>
        (function() {
            const html = document.documentElement;
            const toggle = document.getElementById('theme-toggle');
            const sun = document.getElementById('theme-sun');
            const moon = document.getElementById('theme-moon');

            function setTheme(isDark) {
                if (isDark) {
                    html.classList.add('dark');
                    sun.classList.remove('hidden');
                    moon.classList.add('hidden');
                    localStorage.setItem('theme', 'dark');
                } else {
                    html.classList.remove('dark');
                    sun.classList.add('hidden');
                    moon.classList.remove('hidden');
                    localStorage.setItem('theme', 'light');
                }
            }

            const saved = localStorage.getItem('theme');
            if (saved) {
                setTheme(saved === 'dark');
            } else {
                setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
            }

            toggle.addEventListener('click', () => setTheme(!html.classList.contains('dark')));

            // Active nav link
            const path = window.location.pathname;
            document.querySelectorAll('nav a[href]').forEach(link => {
                const href = link.getAttribute('href');
                if (href === path || (href !== '/' && path.startsWith(href))) {
                    link.classList.add('bg-brand-500', 'text-white');
                    link.classList.remove('text-slate-600', 'dark:text-slate-400');
                }
            });

            // Mobile menu
            const menuBtn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            if (menuBtn && menu) {
                menuBtn.addEventListener('click', () => menu.classList.toggle('hidden'));
            }
        })();
    </script>
</body>
</html>
