<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gym Dashboard{% endblock %} | Gym Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen antialiased">
    <nav class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🏋️</span>
                    <span class="font-bold text-lg tracking-tight">Gym Dashboard</span>
                </div>
                <div class="flex items-center gap-6 text-sm">
                    <a href="/" class="text-gray-300 hover:text-white transition-colors">Dashboard</a>
                    <a href="/dashboard/stats" class="text-gray-400 hover:text-white transition-colors">Stats</a>
                    <a href="/dashboard/members" class="text-gray-400 hover:text-white transition-colors">Members</a>
                    <a href="/dashboard/payments" class="text-gray-400 hover:text-white transition-colors">Payments</a>
                    <a href="/dashboard/health" class="text-gray-400 hover:text-white transition-colors">Health</a>
                    {% if admin %}
                    <span class="text-gray-500 text-xs ml-4">Chat: {{ admin.chat_id }}</span>
                    <a href="/logout" class="text-gray-500 hover:text-red-400 transition-colors text-xs">Salir</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
